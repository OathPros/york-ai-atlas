<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>York AI Atlas | Content consolidation audit</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="topline"><h1 class="brand">YORK AI ATLAS</h1></div>
    <div id="metrics" class="metrics" aria-label="Audit statistics"></div>
  </header>
  <main>
    <nav class="tabs" aria-label="Audit views">
      <button data-tab="inventory" class="active" aria-current="page">01 <span>Resource inventory</span></button>
      <button data-tab="needs">02 <span>Catalogue of need</span></button>
      <button data-tab="sitemap">03 <span>Current sitemap</span></button>
      <button data-tab="overlaps">04 <span>Overlap & risk</span></button>
      <button data-tab="blueprint">05 <span>Proposed single hub</span></button>
      <button data-tab="method">06 <span>Evidence & method</span></button>
    </nav>
    <section id="inventory" class="panel">
      <div class="section-head"><h2>The resource inventory</h2><button id="export" class="button secondary">Export filtered CSV &gt;</button></div>
      <div class="workspace">
        <aside class="filters" aria-label="Resource filters">
          <label for="search">Search the landscape</label><input id="search" type="search" placeholder="Try: citation, Copilot, privacy..." autocomplete="off">
          <label for="audience">Audience</label><select id="audience"><option value="">All audiences</option></select>
          <label for="owner">Publishing family (inferred)</label><select id="owner"><option value="">All publishing families</option></select>
          <label for="domain">Website / hostname</label><select id="domain"><option value="">All hostnames</option></select>
          <label for="action">Proposed action</label><select id="action"><option value="">All actions</option></select>
          <label for="evidence">Evidence status</label><select id="evidence"><option value="">All evidence statuses</option></select>
          <label for="topic">Topic</label><select id="topic"><option value="">All topics</option></select>
          <label for="resource-need">Answers questions in parent job</label><select id="resource-need"><option value="">Any (including unmapped)</option></select>
          <button id="reset" class="text-button">Clear all filters</button>
        </aside>
        <div class="results">
          <div id="quick-tags" class="chips" aria-label="Quick topic filters"></div>
          <div class="results-bar"><span id="result-count" role="status" aria-live="polite"></span><div><label for="sort" class="sr-only">Sort resources</label><select id="sort"><option value="priority">Priority: highest first</option><option value="title">Title: A to Z</option><option value="domain">Hostname: A to Z</option><option value="owner">Publishing family: A to Z</option><option value="hops">Observed hub distance</option><option value="action">Proposed action</option></select><button id="view-toggle" class="button secondary" aria-pressed="false">Table view</button></div></div>
          <div id="resource-list"></div>
        </div>
      </div>
    </section>
    <section id="needs" class="panel" hidden></section>
    <section id="sitemap" class="panel" hidden></section>
    <section id="overlaps" class="panel" hidden></section>
    <section id="blueprint" class="panel" hidden></section>
    <section id="method" class="panel" hidden></section>
  </main>
  <dialog id="detail" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
</body>
</html>
